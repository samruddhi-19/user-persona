<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connecting to User Personaa…</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        background: #1d2125;
        color: #f7f8f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
        box-sizing: border-box;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid rgba(87, 157, 255, 0.2);
        border-top-color: #579dff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .title {
        font-size: 16px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      .subtitle {
        font-size: 13px;
        color: #9fadbc;
        margin: 0;
        max-width: 320px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="spinner" id="spinner"></div>
    <p class="title" id="status-title">Connecting to User Personaa…</p>
    <p class="subtitle" id="status-desc">Please wait while we complete your Trello authorization.</p>
    <script src="./authorized.js"></script>
  </body>
</html>
