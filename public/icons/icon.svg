<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="upGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#579DFF" />
      <stop offset="50%" stop-color="#8546FF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8546FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background shape -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#1D2125" stroke="#333C43" stroke-width="2"/>
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#upGradient)" opacity="0.12"/>
  
  <!-- Persona Avatar Silhouette & Badge -->
  <g filter="url(#glow)">
    <!-- Avatar Head -->
    <circle cx="32" cy="23" r="10" fill="url(#upGradient)" />
    <!-- Avatar Body / Shoulders -->
    <path d="M16 47 C16 38, 23 35, 32 35 C41 35, 48 38, 48 47" fill="url(#upGradient)" />
  </g>
  <!-- Persona Card Detail Accent Tag -->
  <rect x="22" y="48" width="20" height="4" rx="2" fill="#579DFF" />
</svg>
